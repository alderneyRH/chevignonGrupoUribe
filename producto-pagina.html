            <img id="imagen"

              <span class="text-sm text-[var(--gris-niebla)] ml-2">(127 valoraciones)</span>
            </div>

            <div class="text-3xl md:text-4xl font-bold text-[var(--gris-niebla)]">
              <strong id="precio" class=""></strong>
            </div>
          </div>

          <!-- Color Selection -->
          <div>
            <h3 class="font-semibold mt-5 mb-1 text-[var(--gris-niebla)]">Color</h3>
            <div class="flex space-x-3">
              <button

      <!-- Productos recomendados -->

          class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 justify-center gap-4 contenedor-productos"

    <section id="envios">
      <script>
        fetch("./partials/envios.html")
          .then((response) => response.text())
          .then((data) => {
            document.getElementById("envios").innerHTML = data;
          });
      </script>
    </section>

    <!-- Footer -->
    <footer id="main-footer" class="w-full">
      <div id="footer-container">
        <script>
          fetch("./partials/footer.html")
            .then((response) => response.text())
            .then((data) => {
              document.getElementById("footer-container").innerHTML = data;
            });
        </script>
      </div>

    <!-- <script src="/js/detalle.js" type="module"></script> -->
    <script src="/js/script.js" type="module"></script>
    <script src="/js/cart.js" type="module"></script>
    <script type="module">
import { addToCart } from "./js/cart.js";

document.querySelector("button.w-full").addEventListener("click", () => {
    const nombre = document.querySelector("h1").textContent.trim();
    const precio = document.querySelector(".text-lg.font-semibold").textContent.replace(/\$|,/g, "").trim();
    const imagen = document.querySelector("section img").src;

    const product = {
        id: nombre.toLowerCase().replace(/\s+/g, "-"), // ID simple
        nombre,
        precio,
        imagen,
        cantidad: 1
    };

    addToCart(product);
    alert("Producto agregado a la bolsa ✅");
});
</script>
